spring:
  application:
    name: backend
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  jpa:
    show-sql: true
    open-in-view: false
    hibernate:
      ddl-auto: update
  datasource:
    driver-class-name: org.postgresql.Driver
    url: ${DATABASE_URL}
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}
server:
  port: 8080
app:
  frontend_url: ${FRONTEND_URL}
  jwt:
    secret: ${JWT_SECRET}
    expiration-ms-access: ${JWT_EXPIRATION_MS_ACCESS:3600000}
    expiration-ms-refresh: ${JWT_EXPIRATION_MS_REFRESH:86400000}
logging:
  level:
    root: INFO
    org.springframework.security: WARN
    org.hibernate.SQL: WARN